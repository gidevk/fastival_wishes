<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>रक्षाबंधन शुभकामनाएं</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      background: #ffebee;
      padding-bottom: 20px;
    }
    nav {
      background: linear-gradient(90deg, #d81b60, #f06292);
      padding: 12px 10px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 6px 12px;
      border-radius: 20px;
    }
    nav a:hover, nav a.active {
      background: rgba(255, 255, 255, 0.25);
    }
    .container {
      width: 92%;
      max-width: 440px;
      margin: 20px auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .glow {
      font-size: 24px;
      color: #c2185b;
      margin: 15px 0;
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .image-options {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }
    .image-option {
      width: 65px;
      height: 65px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      object-fit: cover;
    }
    .image-option.selected {
      border-color: #d81b60;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    button {
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      background-color: #d81b60;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    .countdown-section {
      background: #880e4f;
      color: white;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .countdown-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .countdown-box {
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 6px;
      min-width: 45px;
    }
    .digit {
      font-size: 18px;
      font-weight: bold;
    }
    .digit-label {
      font-size: 9px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="active">रक्षाबंधन</a>
    <a href="15_Aug/independence_day.html">स्वतंत्रता दिवस</a>
    <a href="ganesh.html">गणेश चतुर्थी</a>
    <a href="navratri.html">नवरात्रि</a>
    <a href="diwali.html">दिवाली</a>
    <a href="holi.html">होली</a>
    <a href="eid.html">ईद</a>
    <a href="chhath.html">छठ पूजा</a>
  </nav>

  <h1 class="glow" id="festivalHeading">🌸 रक्षाबंधन की शुभकामनाएं 🌸</h1>

  <div class="container">
    <div class="countdown-section">
      <div id="countdownStatus" style="font-size: 13px; margin-bottom: 8px;">रक्षाबंधन आने में बचा समय:</div>
      <div class="countdown-wrapper">
        <div class="countdown-box"><div id="days" class="digit">00</div><div class="digit-label">दिन</div></div>
        <div class="countdown-box"><div id="hours" class="digit">00</div><div class="digit-label">घंटे</div></div>
        <div class="countdown-box"><div id="minutes" class="digit">00</div><div class="digit-label">मिनट</div></div>
        <div class="countdown-box"><div id="seconds" class="digit">00</div><div class="digit-label">सेकंड</div></div>
      </div>
    </div>

    <img src="rakhi1.jpg" alt="रक्षाबंधन" id="rakhiImage">
    
    <div class="image-options">
      <img src="rakhi1.jpg" class="image-option selected" onclick="changeImage(this, 'rakhi1.jpg')">
      <img src="rakhi2.jpg" class="image-option" onclick="changeImage(this, 'rakhi2.jpg')">
      <img src="rakhi3.jpg" class="image-option" onclick="changeImage(this, 'rakhi3.jpg')">
      <img src="rakhi4.jpg" class="image-option" onclick="changeImage(this, 'rakhi4.jpg')">
      <img src="rakhi5.jpg" class="image-option" onclick="changeImage(this, 'rakhi5.jpg')">
    </div>

    <input type="text" id="senderName" placeholder="आपका नाम">
    <button onclick="shareOnWhatsApp()">WhatsApp पर शेयर करें</button>
    <div id="festivalShareGameContainer"></div>
  </div>

  <script src="festival-core.js"></script>
  <script>
    let selectedImageUrl = 'rakhi1.jpg';
    let festivalWishes = [];

    document.addEventListener('DOMContentLoaded', function() {
      const info = initFestivalPage('rakhi', false);
      festivalWishes = info.cfg.wishes;
      renderUniversalFestivalShareGameUI('rakhi', 'festivalShareGameContainer');
    });

    function changeImage(element, imageUrl) {
      document.getElementById('rakhiImage').src = imageUrl;
      selectedImageUrl = imageUrl;
      document.querySelectorAll('.image-option').forEach(img => img.classList.remove('selected'));
      element.classList.add('selected');
    }

    function shareOnWhatsApp() {
      const name = document.getElementById("senderName").value.trim() || "शुभचिंतक";
      const wishes = festivalWishes(name);
      const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
      const fullMessage = `${randomWish}\n${window.location.href}`;
      incrementFestivalGameShare('rakhi');
      window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(fullMessage)}`;
    }
  </script>
</body>
</html>
